name: Probe API domain (temporary diagnostics)
on:
  push:
    branches: [claude/app-analysis-improvements-9n8r2x]
    paths: ['.github/workflows/probe-api.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          dig +short api.molavolt.com CNAME; dig +short api.molavolt.com A
          for h in api.molavolt.com molavolt.vercel.app; do
            echo "== $h OPTIONS"; curl -sS -m 30 -o /dev/null -D - -X OPTIONS -H 'Origin: https://molavolt.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' https://$h/api/push | grep -i -E '^HTTP|access-control' || true
            echo "== $h POST"; curl -sS -m 30 -X POST -H 'Origin: https://molavolt.com' -H 'Content-Type: application/json' --data '{}' -D - https://$h/api/push | grep -i -E '^HTTP|access-control|"error"' || true
          done
