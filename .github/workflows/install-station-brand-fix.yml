name: Install station brand fix
on:
  push:
    paths:
      - 'STATION_FIX_TRIGGER.txt'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject station fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="station-brand-price-fix.js?v=20261006"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          Path('STATION_FIX_TRIGGER.txt').unlink(missing_ok=True)
          PY
          git config user.name 'MolaVolt Bot'
          git config user.email 'actions@github.com'
          git add index.html station-brand-price-fix.js STATION_FIX_TRIGGER.txt
          git diff --cached --quiet || git commit -m 'fix station brands and prices [skip ci]'
          git push
