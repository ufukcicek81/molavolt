name: Build MolaVolt Android API 36
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-release/**'
      - '.github/workflows/build-molavolt-android.yml'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'splash-logo.png'
permissions:
  contents: read
jobs:
  android-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare existing upload key when configured
        env:
          KEYSTORE_B64: ${{ secrets.MOLAVOLT_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.MOLAVOLT_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOLAVOLT_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOLAVOLT_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/molavolt-upload.jks"
            echo "MOLAVOLT_UPLOAD_STORE_FILE=$RUNNER_TEMP/molavolt-upload.jks" >> "$GITHUB_ENV"
            echo "MOLAVOLT_SIGNING_STATUS=signed" >> "$GITHUB_ENV"
          else
            echo "MOLAVOLT_SIGNING_STATUS=UNSIGNED-do-not-upload" >> "$GITHUB_ENV"
          fi
      - name: Build API 36 AAB
        working-directory: android-release
        env:
          MOLAVOLT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MOLAVOLT_UPLOAD_KEYSTORE_PASSWORD }}
          MOLAVOLT_UPLOAD_KEY_ALIAS: ${{ secrets.MOLAVOLT_UPLOAD_KEY_ALIAS }}
          MOLAVOLT_UPLOAD_KEY_PASSWORD: ${{ secrets.MOLAVOLT_UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace
      - name: Show signing certificate (compare with Play Console > App integrity > Upload key)
        run: |
          AAB=$(ls android-release/app/build/outputs/bundle/release/*.aab | head -1)
          VER=$(grep -E "versionName|versionCode" android-release/app/build.gradle | tr -s ' ' | tr '\n' ' ')
          {
            echo "## MolaVolt AAB"
            echo "- Sürüm: $VER"
            echo "- İmza durumu: **$MOLAVOLT_SIGNING_STATUS**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MOLAVOLT_SIGNING_STATUS" = "signed" ]; then
            SHA=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
            if [ -z "$SHA" ]; then echo "::error::Secrets are set but the AAB is not signed"; exit 1; fi
            echo "- İmza SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Bu değer Play Console > Uygulama bütünlüğü > **Yükleme anahtarı sertifikası** SHA-256 ile aynı olmalı." >> "$GITHUB_STEP_SUMMARY"
            echo "Upload certificate SHA-256: $SHA"
          else
            echo "- İmza anahtarı secret'ları eksik: bu AAB Play'e YÜKLENEMEZ." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MolaVolt-${{ env.MOLAVOLT_SIGNING_STATUS }}
          path: android-release/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      # Same build as an APK for installing directly on a test phone (uninstall the Play version first).
      - uses: actions/upload-artifact@v4
        with:
          name: MolaVolt-test-apk-${{ env.MOLAVOLT_SIGNING_STATUS }}
          path: android-release/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
