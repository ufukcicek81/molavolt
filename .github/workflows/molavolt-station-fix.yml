name: MolaVolt station data fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch station data UI and refresh
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          new_norm=r'''function normalizeEpdkData(data){data=parseMaybe(data);let rows=[];function nestedRows(v){v=parseMaybe(v);if(!v)return[];if(Array.isArray(v))return v;if(typeof v!=='object')return[];for(const k of ['rows','data','result','items','records','list','content']){if(v[k]!==undefined){const a=nestedRows(v[k]);if(a.length)return a}}for(const k of Object.keys(v)){if(Array.isArray(v[k])&&v[k].length)return v[k]}return[]}const cols=(data&&Array.isArray(data.columnNames))?data.columnNames:((data&&Array.isArray(data.columns))?data.columns:[]);if(data&&typeof data.result==='string')data={...data,result:parseMaybe(data.result)};rows=nestedRows(data);const out=[];rows.forEach((raw,idx)=>{raw=parseMaybe(raw);const r=rowObject(raw,cols);const lat=toNum(pick(r,['enlem','lat','latitude','koordinatx','koordinatX']));const lon=toNum(pick(r,['boylam','lon','lng','longitude','koordinaty','koordinatY']));if(!isFinite(lat)||!isFinite(lon))return;const socketRaw=pick(r,['soketler','sockets','socketler','sarjSoketleri','sarjIstasyonuSoketleri','sarjUniteleri','soketBilgileri','soketBilgisi']);const sok=socketSummary(socketRaw);const name=pick(r,['sarjIstasyonuAdi','istasyonAdi','istasyonAd','ad','name','stationName'])||'EPDK Şarj İstasyonu';const op=pick(r,['markaAdi','marka','tescilliMarka','sarjAgiMarka','sarjAgiIsletmecisiUnvan','sarjAgiIsletmecisi','sarjIstasyonuIsletmecisi','isletmeciUnvan','operator','operatorName','company'])||'Diğer';const address=pick(r,['adres','address','istasyonAdresi'])||'Adres bilgisi yok';const no=pick(r,['sarjIstasyonuNo','istasyonNo','stationId','id'])||(idx+'-'+lat.toFixed(5)+'-'+lon.toFixed(5));const stationPrice=pick(r,['soketFiyati','soketFiyat','soketBirimFiyati','soketBirimFiyat','birimFiyat','birimFiyatTl','birimFiyatTL','birimEnerjiFiyati','sarjHizmetiFiyati','sarjHizmetiFiyat','sarjHizmetiBirimFiyati','sarjHizmetiBirimFiyat','enerjiBirimFiyati','enerjiBirimFiyat','fiyat','fiyatTl','fiyatTL','price','unitPrice','tarife','ucret','ücret','kwhFiyat','kWhFiyat']);const priceNum=toNum(stationPrice);const brandName=String(op).trim()||'Diğer';out.push({id:'epdk-'+String(no).replace(/[^a-zA-Z0-9_.-]/g,'-')+'-'+idx,name:String(name),brand:brandName,brandName:brandName,operator:brandName,brandGroup:normBrand(brandName),type:pick(r,['hizmetSekli'])||'Şarj',status:String(pick(r,['durum','status'])||'Açık'),address:String(address),lat,lon,distance:km(userPos.lat,userPos.lon,lat,lon),sockets:sok.sockets,power:sok.power,price:Number.isFinite(priceNum)?priceNum:null,priceText:Number.isFinite(priceNum)?priceNum.toFixed(2)+' TL/kWh':'Fiyat bilgisi yok',raw:r,source:'EPDK'})});const seen=new Set();return out.filter(s=>{const key=s.name+'|'+s.lat.toFixed(5)+'|'+s.lon.toFixed(5)+'|'+s.brandName;if(seen.has(key))return false;seen.add(key);return true})}function clearLegacy'''
          text,n=re.subn(r'function normalizeEpdkData\(data\)\{.*?\}function clearLegacy',new_norm,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('normalizeEpdkData block not found')

          new_chips=r'''function renderChips(){const names=[...new Set((stations||[]).map(s=>String(s.brandName||s.brand||'Diğer').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));const list=['Tümü',...names];$('brandChips').innerHTML=list.map(b=>`<button class="chip ${b===currentBrand?'active':''}" onclick="setBrand('${esc(b)}')">${esc(b)}</button>`).join('')}function setBrand'''
          text,n=re.subn(r'function renderChips\(\)\{.*?\}function setBrand',new_chips,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderChips block not found')

          new_card=r'''function stationCard(s){const offers=offerCount(s.id);const offerBadge=offers>0?`<span class="stationOfferCountBadge">🎁 ${offers} fırsat</span>`:'';const brand=String(s.brandName||s.brand||'Diğer');const price=s.priceText||'Fiyat bilgisi yok';const sockets=String(s.sockets||'Soket bilgisi yok');const power=String(s.power||'Güç bilgisi yok');return `<div class="station premiumStation" onclick="openDetail('${esc(s.id)}')"><div class="stationTop"><div style="min-width:0;flex:1"><div class="tags"><span class="tag g">${esc(brand)}</span><span class="tag b">${esc(s.status||'Bilinmiyor')}</span>${offerBadge}</div><h4>${esc(s.name)}</h4><p>${esc(s.address)}</p></div><div class="distanceBox"><b>${Number(s.distance||0).toFixed(1)}</b><span>km</span></div></div><div class="stationDataGrid"><div><small>Şarj</small><strong>${esc(power)}</strong></div><div><small>Soket</small><strong>${esc(sockets)}</strong></div><div><small>Tarife</small><strong>${esc(price)}</strong></div></div><div class="cardActions"><button class="mapShowBtn" onclick="openStationMap('${esc(s.id)}',event)">Haritada gör</button><a class="routeBtn routeActionBtn" href="${routeUrl(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Yol tarifi</a></div></div>`}function renderCards'''
          text,n=re.subn(r'function stationCard\(s\)\{.*?\}function renderCards',new_card,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('stationCard block not found')

          css='''\n/* UFUK_STATION_PREMIUM_DATA_1006 */\n.premiumStation{padding:16px!important}.premiumStation .stationTop{align-items:flex-start}.distanceBox{min-width:58px;text-align:right;color:#dfffee}.distanceBox b{display:block;font-size:22px;line-height:1}.distanceBox span{font-size:11px;color:var(--muted)}.stationDataGrid{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;margin-top:14px}.stationDataGrid>div{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:15px;padding:9px 8px;min-width:0}.stationDataGrid small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.stationDataGrid strong{display:block;color:#f1f8ff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.premiumStation .cardActions{margin-top:12px!important}.premiumStation h4{font-size:18px!important;line-height:1.15!important}\n'''
          if 'UFUK_STATION_PREMIUM_DATA_1006' not in text:text=text.replace('</style>',css+'</style>',1)

          refresh='''\n<script>\n/* UFUK_EPDK_FORCE_FRESH_1006 */\n(function(){const API='https://molavolt.vercel.app/api/epdk';async function freshStations(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return false;const data=await r.json();const list=typeof normalizeEpdkData==='function'?normalizeEpdkData(data):[];if(!Array.isArray(list)||!list.length)return false;if(typeof setEpdkStations==='function')setEpdkStations(list);if(typeof buildStations==='function')buildStations();if(typeof applyFilters==='function')applyFilters();if(typeof renderChips==='function')renderChips();try{localStorage.setItem('molavolt_epdk_last_refresh',String(Date.now()));}catch(e){}return true}catch(e){console.warn('MolaVolt fresh EPDK failed',e);return false}}const old=window.ensureRouteStationsReady0521;window.ensureRouteStationsReady0521=async function(){const ok=await freshStations();if(ok)return{ok:true,source:'epdk-live',count:(window.stations||[]).length};return old?old.apply(this,arguments):{ok:false,source:'none',count:0}};window.addEventListener('load',function(){setTimeout(freshStations,900)})})();\n</script>\n'''
          if 'UFUK_EPDK_FORCE_FRESH_1006' not in text:text=text.replace('</body>',refresh+'</body>',1)

          p.write_text(text,encoding='utf-8')
          print('patched index',len(text))
          PY
          git config user.name "MolaVolt Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix live EPDK brands and station prices"
          git push
