name: Asset links probe (temporary)
on:
  push:
    branches: [claude/app-analysis-improvements-9n8r2x]
    paths: ['.github/workflows/assetlinks-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Served file
        run: |
          for u in https://molavolt.com/.well-known/assetlinks.json https://www.molavolt.com/.well-known/assetlinks.json; do
            echo "=== $u"; curl -sS -L -m 30 -D - -o body.txt "$u" | grep -iE '^(HTTP|content-type|location)'; cat body.txt; echo; done
      - name: Google Digital Asset Links verdict
        run: |
          curl -sS -m 30 "https://digitalassetlinks.googleapis.com/v1/statements:list?source.web.site=https://molavolt.com&relation=delegate_permission/common.handle_all_urls"; echo
          curl -sS -m 30 "https://digitalassetlinks.googleapis.com/v1/assetlinks:check?source.web.site=https://molavolt.com&relation=delegate_permission/common.handle_all_urls&target.android_app.package_name=com.molavolt.app&target.android_app.certificate.sha256_fingerprint=38:2A:3C:AA:B4:BD:71:0E:1E:89:B9:E1:DE:01:DE:64:36:34:AA:5E:E0:8F:5B:52:12:00:FB:56:68:FF:15:BE"; echo
